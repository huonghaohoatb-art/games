    if(block(url)) return;

    if(block(url)) return;

};

    if(block(url)) return null;
    return _open.apply(window,arguments);
};

/* intercept setTimeout */
const _setTimeout = window.setTimeout;
window.setTimeout = function(fn,t){
    if(typeof fn === "string" && fn.includes("location")){
        console.log("🚫 timeout redirect blocked");
        return;
    }
    return _setTimeout(fn,t);
};

/* intercept setInterval */
const _setInterval = window.setInterval;

    if(typeof fn === "string" && fn.includes("location")){
        console.log("🚫 interval redirect blocked");

    }
    return _setInterval(fn,t);
};

/* remove meta refresh */
new MutationObserver(()=>{
    document.querySelectorAll('meta[http-equiv="refresh"]').forEach(e=>{
        console.log("🚫 meta redirect removed");
        e.remove();
    });
}).observe(document.documentElement,{childList:true,subtree:true});

})();
