  <script>
(function(){

function block(url){
    console.log("🚫 Redirect blocked:", url);
    return true;
}

/* location.assign */
const _assign = window.location.assign;
window.location.assign = function(url){
    if(block(url)) return;
    return _assign.call(location,url);
};

/* location.replace */
const _replace = window.location.replace;
window.location.replace = function(url){
    if(block(url)) return;
    return _replace.call(location,url);
};

/* window.open */
const _open = window.open;
window.open = function(url){
    if(block(url)) return null;
    return _open.apply(window,arguments);
};

/* intercept setTimeout */
const _setTimeout = window.setTimeout;
window.setTimeout = function(fn,t){
    if(typeof fn === "string" && fn.includes("location")){
        console.log("🚫 timeout redirect blocked");
        return;
    }
    return _setTimeout(fn,t);
};

/* intercept setInterval */
const _setInterval = window.setInterval;
window.setInterval = function(fn,t){
    if(typeof fn === "string" && fn.includes("location")){
        console.log("🚫 interval redirect blocked");
        return;
    }
    return _setInterval(fn,t);
};

/* remove meta refresh */
new MutationObserver(()=>{
    document.querySelectorAll('meta[http-equiv="refresh"]').forEach(e=>{
        console.log("🚫 meta redirect removed");
        e.remove();
    });
}).observe(document.documentElement,{childList:true,subtree:true});

})();
</script>

    <script>
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		// Runtime calls this global method when ready to start caching (i.e. after startup).
		// This registers the service worker which caches resources for offline support.
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;		// no SW support, ignore call
			
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
